<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Umrah Trip Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--g:#0b5d47;--g2:#0e7a5d;--gl:#e6f2ee;--gold:#b88a2e;--ink:#1c2421;--mut:#66726d;--line:#dfe5e2;--bg:#f5f7f6;--card:#fff;--red:#b42318;--redl:#fdecea;--amb:#a15c07;--ambl:#fef4e2;--blu:#1d4ed8;--blul:#e8eefc;--r:12px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Plus Jakarta Sans",system-ui,-apple-system,Segoe UI,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0 0 .4em;line-height:1.2}h1{font-size:1.35rem}h2{font-size:1.12rem}h3{font-size:1rem}
a{color:var(--g2)}
.top{position:sticky;top:0;z-index:20;background:var(--g);color:#fff;display:flex;align-items:center;gap:12px;padding:10px 16px}
.top .brand{font-weight:700;letter-spacing:.2px;display:flex;align-items:center;gap:8px}
.top .brand i{display:inline-block;width:26px;height:26px;border-radius:7px;background:var(--gold);position:relative}
.top .brand i:after{content:"";position:absolute;inset:7px;border:2px solid #fff;border-radius:2px}
.top .sp{flex:1}.top .who{font-size:.82rem;opacity:.9;text-align:right}
.top .btn{background:rgba(255,255,255,.14);color:#fff;border-color:transparent}
.layout{display:flex;min-height:calc(100vh - 52px)}
nav.side{width:210px;flex:none;background:#fff;border-right:1px solid var(--line);padding:12px 8px}
nav.side a{display:block;padding:9px 12px;border-radius:9px;color:var(--ink);text-decoration:none;font-weight:500;cursor:pointer}
nav.side a.on{background:var(--gl);color:var(--g)}
main{flex:1;min-width:0;padding:18px;max-width:1100px}
@media(max-width:860px){.layout{display:block}nav.side{width:auto;display:flex;overflow-x:auto;gap:4px;border-right:0;border-bottom:1px solid var(--line);padding:6px 8px;position:sticky;top:52px;z-index:15}nav.side a{white-space:nowrap;padding:7px 12px}main{padding:12px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.card.tight{padding:12px}
.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:700px){.g2,.g3,.g4{grid-template-columns:1fr}.g4.keep{grid-template-columns:repeat(2,1fr)}}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}
.mut{color:var(--mut)}.sm{font-size:.84rem}.b{font-weight:600}.r{text-align:right}
.fld{display:flex;flex-direction:column;gap:4px;font-size:.84rem;color:var(--mut);font-weight:500}
.fld input,.fld select,.fld textarea,input.in,select.in{border:1px solid var(--line);border-radius:9px;padding:9px 10px;background:#fff;color:var(--ink);font-size:.95rem;width:100%;min-width:0}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:2px solid var(--g2);outline-offset:-1px;border-color:transparent}
.fld input:disabled{background:#f1f3f2}
.chk{display:flex;gap:8px;align-items:center;font-size:.92rem;cursor:pointer}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:.9rem;white-space:nowrap}
.btn:hover{border-color:var(--g2)}
.btn.p{background:var(--g);border-color:var(--g);color:#fff}.btn.p:hover{background:var(--g2)}
.btn.d{color:var(--red)}.btn.d.p{background:var(--red);border-color:var(--red);color:#fff}
.btn.s{padding:5px 10px;font-size:.8rem}.btn.l{padding:12px 18px;font-size:1rem;width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:.76rem;font-weight:600;background:#eef1f0;color:#46524d;white-space:nowrap}
.chip.green{background:var(--gl);color:var(--g)}.chip.red{background:var(--redl);color:var(--red)}.chip.amber{background:var(--ambl);color:var(--amb)}.chip.blue{background:var(--blul);color:var(--blu)}.chip.teal{background:#e3f4f6;color:#0b6672}.chip.gold{background:#f7eedc;color:#7d5b16}
.stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px}.stat .v{font-size:1.25rem;font-weight:700}.stat .k{font-size:.76rem;color:var(--mut)}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:8px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:.75rem;text-transform:uppercase;letter-spacing:.4px;color:var(--mut);font-weight:600;background:#fafbfb}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:#fff}
.tw table th:first-child,.tw table td:first-child{padding-left:12px}
tr.click{cursor:pointer}tr.click:hover td{background:#f7faf9}
.issues{background:var(--redl);border:1px solid #f5c2bd;color:#7a1a12;border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:.88rem}
.issues ul{margin:4px 0 0;padding-left:18px}
.ok{background:var(--gl);border:1px solid #bfdcd1;color:var(--g);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:.88rem}
.note{background:var(--ambl);border:1px solid #f3d9a8;color:#6b3d04;border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:.86rem}
.pax{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;background:#fff}
.doclist{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.doc{border:1px dashed #b8c4bf;border-radius:8px;padding:5px 9px;font-size:.8rem;background:#fafcfb;cursor:pointer}
.doc.miss{border-color:#efb3ac;color:var(--red);cursor:default;background:#fff}
.upl{border:1px dashed #b8c4bf;border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px;font-size:.84rem;background:#fafcfb}
.upl.has{border-style:solid;border-color:#bfdcd1;background:var(--gl)}
.upl input[type=file]{font-size:.8rem;max-width:100%}
.tabs{display:flex;gap:4px;overflow-x:auto;margin-bottom:12px;border-bottom:1px solid var(--line)}
.tabs a{padding:8px 12px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;font-weight:500;color:var(--mut)}
.tabs a.on{border-color:var(--g);color:var(--g)}
.ov{position:fixed;inset:0;background:rgba(15,25,20,.45);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow-y:auto}
.ov .box{background:#fff;border-radius:14px;width:100%;max-width:720px;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.ov .box.sm{max-width:440px}
.ov .box img{max-width:100%;border-radius:8px}
#dialog .ov{z-index:60}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:6px;align-items:center}
#toast div{background:#1c2421;color:#fff;padding:10px 16px;border-radius:10px;font-size:.88rem;box-shadow:0 6px 20px rgba(0,0,0,.2);max-width:90vw}
#toast div.err{background:var(--red)}
.login{max-width:430px;margin:5vh auto;padding:0 12px}
.login .hero{text-align:center;margin-bottom:18px}
.login .hero .m{width:56px;height:56px;border-radius:14px;background:var(--g);margin:0 auto 10px;position:relative}
.login .hero .m:after{content:"";position:absolute;inset:15px;border:3px solid var(--gold);border-radius:3px}
.seg{display:flex;background:#e9eeec;border-radius:10px;padding:3px;margin-bottom:14px}
.seg a{flex:1;text-align:center;padding:8px;border-radius:8px;cursor:pointer;font-weight:600;color:var(--mut)}
.seg a.on{background:#fff;color:var(--g);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.banner{background:#fff7e6;color:#6b3d04;border-bottom:1px solid #f3d9a8;padding:7px 16px;font-size:.84rem}
.leg{display:grid;grid-template-columns:1.1fr 1fr 1fr 1.4fr 1.4fr auto;gap:8px;align-items:end;margin-bottom:8px}
@media(max-width:860px){.leg{grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:10px;padding:10px}}
.hist{font-size:.82rem;border-left:2px solid var(--line);padding-left:12px;margin-left:4px}
.hist div{margin-bottom:6px}
.money td:last-child,.money th:last-child{text-align:right;white-space:nowrap}
.tot td{font-weight:700;background:#fafbfb}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
.hide{display:none!important}
.trip-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:.88rem}.kv span:nth-child(odd){color:var(--mut)}
.bar{height:7px;background:#e9eeec;border-radius:9px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--g2)}
.stick{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 30%);padding:14px 0 6px;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
</style>
</head>
<body>
<div id="root"></div>
<div id="modal"></div>
<div id="dialog"></div>
<div id="toast"></div>
<div id="busy" style="display:none;position:fixed;top:0;left:0;right:0;height:3px;background:var(--gold);z-index:90"></div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
"use strict";
/* ================= CONFIG ================= */
const CFG = window.APP_CONFIG || {};
const DEFAULT_SETTINGS = {orgName:"Umrah Trips", currency:"OMR", otpMode:"off", infantMaxAge:1, childMaxAge:5, passportMonths:6, residenceMonths:3, pilgrimDomain: CFG.PILGRIM_EMAIL_DOMAIN || "pilgrims.umrah.app"};
const DEFAULT_VISA = [
  {id:"HAS_MULTI", name:"Already has multi-entry visa", needsCopy:true},
  {id:"NEED_MULTI", name:"Needs multi-entry visa"},
  {id:"NEED_UMRAH", name:"Needs Umrah visa (single entry)"}];
const MASTER_KEYS = [
  {key:"regions", label:"Regions", fields:[["name","Name"]]},
  {key:"divisions", label:"Divisions", parent:"regions", fields:[["name","Name"]]},
  {key:"units", label:"Units", parent:"divisions", fields:[["name","Name"]]},
  {key:"hotels", label:"Hotels", fields:[["name","Name"],["city","City","city"],["distance","Distance to Haram"],["contact","Contact"]]},
  {key:"food", label:"Food suppliers", fields:[["name","Name"],["city","City","city"],["plan","Meal plan"],["contact","Contact"]]},
  {key:"transport", label:"Transport", fields:[["name","Name"],["kind","Type","kind"],["contact","Contact"]]},
  {key:"roomTypes", label:"Room types", fields:[["name","Name"],["capacity","Beds","num"]]}];
const ROLES = {super:"Super Admin", admin:"Trip Admin / Approver", finance:"Finance", ameer:"Ameer"};
const BSTATUS = {enquiry:["New request","gold"], details:["Details requested","amber"], draft:["Draft","grey"], submitted:["Submitted","blue"], review:["Under review","blue"], correction:["Needs correction","amber"], approved:["Approved","green"], confirmed:["Confirmed (paid)","green"], travelled:["Travelled","teal"], rejected:["Rejected","red"], cancelled:["Cancelled","red"]};
const ACTIVE = ["submitted","review","correction","approved","confirmed","travelled"];
const PIPE = ["enquiry","details"];
const reqText = r => r ? [r.adults ? r.adults + " adult" + (r.adults>1?"s":"") : "", r.children ? r.children + " child" + (r.children>1?"ren":"") : "", r.infants ? r.infants + " infant" + (r.infants>1?"s":"") : ""].filter(Boolean).join(", ") : "";
const TSTATUS = {draft:["Draft","grey"], open:["Registration open","green"], closed:["Registration closed","amber"], ongoing:["Ongoing","blue"], completed:["Completed","teal"], cancelled:["Cancelled","red"]};
const DOCS = [["passportFront","Passport – front"],["passportBack","Passport – back"],["residenceFront","Residence card – front"],["residenceBack","Residence card – back"],["visa","Visa page / copy"]];
const RELS = ["Self","Spouse","Son","Daughter","Father","Mother","Brother","Sister","Father-in-law","Mother-in-law","Grandchild","Relative","Friend","Other"];
const CITIES = ["Makkah","Madinah"];

/* ================= UTIL ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = p => p + "-" + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const clone = o => o == null ? o : JSON.parse(JSON.stringify(o));
const nowISO = () => new Date().toISOString();
const iso = d => d.toISOString().slice(0,10);
const today = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,10); };
const parseD = s => { const [y,m,d] = s.split("-").map(Number); return new Date(Date.UTC(y,m-1,d)); };
const fmtD = s => s ? parseD(s).toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric",timeZone:"UTC"}) : "—";
const fmtDT = s => s ? new Date(s).toLocaleString("en-GB",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"}) : "";
const addDays = (s,n) => { const d = parseD(s); d.setUTCDate(d.getUTCDate()+n); return iso(d); };
const addMonths = (s,n) => { const d = parseD(s), day = d.getUTCDate(); d.setUTCDate(1); d.setUTCMonth(d.getUTCMonth()+n); const last = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth()+1, 0)).getUTCDate(); d.setUTCDate(Math.min(day,last)); return iso(d); };
const daysBetween = (a,b) => Math.round((parseD(b)-parseD(a))/86400000);
function ageOn(dob, ref){ const a = parseD(dob), r = parseD(ref); let y = r.getUTCFullYear()-a.getUTCFullYear(); if (r.getUTCMonth()<a.getUTCMonth() || (r.getUTCMonth()===a.getUTCMonth() && r.getUTCDate()<a.getUTCDate())) y--; return y; }
const num = v => Number(v) || 0;
const fv = (form, n) => { const el = form.elements.namedItem(n); return el ? el.value : ""; };
const money = n => `${settings().currency} ${num(n).toFixed(3)}`;
const normMobile = m => { let d = String(m||"").replace(/\D/g,""); if (d.length === 8) d = "968" + d; return d; };
const showMobile = m => m ? "+" + m : "—";
function setPath(obj, path, val){ const ks = path.split("."); let o = obj; for (let i=0;i<ks.length-1;i++){ const k = ks[i]; if (o[k] == null || typeof o[k] !== "object") o[k] = /^\d+$/.test(ks[i+1]) ? [] : {}; o = o[k]; } o[ks[ks.length-1]] = val; }
async function hashPin(mobile, pin){ const data = new TextEncoder().encode("umra:" + mobile + ":" + pin); const buf = await crypto.subtle.digest("SHA-256", data); return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join(""); }
function toast(msg, kind){ const el = document.createElement("div"); if (kind) el.className = kind; el.textContent = msg; $("#toast").appendChild(el); setTimeout(()=>el.remove(), kind==="err" ? 5000 : 2600); }
function csvCell(v){ v = String(v ?? ""); return /[",\n]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v; }

/* ================= STORE (Supabase) ================= */

const sb = (window.supabase && CFG.SUPABASE_URL && CFG.SUPABASE_ANON_KEY) ? window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY) : null;
const DB = {loaded:false, error:"", user:null, staffId:null, seats:{}, hist:{},
  data:{app:{settings:{}, masters:{}}, trips:{}, profiles:{}, accounts:{}, bookings:{}, staff:{}}};
const nul = v => (v === "" || v === undefined) ? null : v;
async function q(p){ const {data, error} = await p; if (error) throw new Error(error.message); return data; }
async function fetchAll(table, order){
  let out = [], from = 0;
  for (;;){
    let qb = sb.from(table).select("*").range(from, from + 999);
    if (order) qb = qb.order(order);
    const data = await q(qb); out = out.concat(data || []);
    if (!data || data.length < 1000) break; from += 1000;
  }
  return out;
}
async function loadAll(){
  const staff = !!DB.staffId, authed = !!DB.user;
  const T = {settings:fetchAll("settings"), regions:fetchAll("regions","name"), divisions:fetchAll("divisions","name"), units:fetchAll("units","name"),
    hotels:fetchAll("hotels","name"), food:fetchAll("food_suppliers","name"), transport:fetchAll("transport_providers","name"), roomTypes:fetchAll("room_types","name"),
    trips:fetchAll("trips"), legs:fetchAll("trip_legs","seq"), staff: staff ? fetchAll("staff","name") : fetchAll("staff_public","name")};
  if (authed) Object.assign(T, {persons:fetchAll("persons"), docs:fetchAll("person_documents"), accounts:fetchAll("accounts"), links:fetchAll("account_persons"),
    bookings:fetchAll("bookings"), pax:fetchAll("booking_passengers","sort"), charges:fetchAll("charges","created_at"), payments:fetchAll("payments","created_at"),
    reqs:fetchAll("room_requests","created_at"), seats:q(sb.rpc("trip_seats"))});
  const keys = Object.keys(T), vals = await Promise.all(Object.values(T)), R = {};
  keys.forEach((k,i) => R[k] = vals[i] || []);
  const d = {app:{settings:{}, masters:{}}, trips:{}, profiles:{}, accounts:{}, bookings:{}, staff:{}};
  const s = R.settings[0];
  if (s) d.app.settings = {orgName:s.org_name, currency:s.currency, otpMode:s.otp_mode, infantMaxAge:s.infant_max_age, childMaxAge:s.child_max_age, passportMonths:s.passport_months, residenceMonths:s.residence_months, pilgrimDomain:s.pilgrim_email_domain};
  d.app.masters = {
    regions: R.regions.map(x => ({id:x.id, name:x.name})),
    divisions: R.divisions.map(x => ({id:x.id, name:x.name, parentId:x.region_id})),
    units: R.units.map(x => ({id:x.id, name:x.name, parentId:x.division_id})),
    hotels: R.hotels.map(x => ({id:x.id, name:x.name, city:x.city, distance:x.distance, contact:x.contact})),
    food: R.food.map(x => ({id:x.id, name:x.name, city:x.city, plan:x.meal_plan, contact:x.contact})),
    transport: R.transport.map(x => ({id:x.id, name:x.name, kind:x.kind, contact:x.contact})),
    roomTypes: R.roomTypes.map(x => ({id:x.id, name:x.name, capacity:x.capacity}))};
  R.trips.forEach(t => d.trips[t.id] = {code:t.code, title:t.title, mode:t.mode, transportId:t.transport_id, departure:t.departure, ameerId:t.ameer_id,
    startDate:t.start_date, endDate:t.end_date, regOpen:t.reg_open, regClose:t.reg_close, maxSeats:t.max_seats, status:t.status,
    fares:{adult:num(t.adult_fare), child:num(t.child_fare), infant:num(t.infant_fare)}, visaFees:t.visa_fees || {}, roomRates:t.room_rates || {}, notes:t.notes, legs:[]});
  R.legs.forEach(l => { if (d.trips[l.trip_id]) d.trips[l.trip_id].legs.push({city:l.city, checkIn:l.check_in, checkOut:l.check_out, hotelId:l.hotel_id, foodId:l.food_id}); });
  R.staff.forEach(x => d.staff[x.id] = {name:x.name, email:x.email, mobile:x.mobile, role:x.role, active:x.active !== false, userId:x.user_id});
  (R.persons||[]).forEach(p => d.profiles[p.id] = {name:p.name, gender:p.gender, dob:p.dob, nationality:p.nationality, passportNo:p.passport_no, passportPlace:p.passport_place,
    passportIssue:p.passport_issue, passportExpiry:p.passport_expiry, onVisitVisa:p.on_visit_visa, residenceNo:p.residence_no, residenceExpiry:p.residence_expiry,
    regionId:p.region_id, divisionId:p.division_id, unitId:p.unit_id, mobile:p.mobile, emergency:p.emergency, docs:{}, docStatus:{}});
  (R.docs||[]).forEach(x => { const p = d.profiles[x.person_id]; if (!p) return; p.docs[x.doc_type] = {path:x.storage_path, name:x.file_name, type:x.content_type}; p.docStatus[x.doc_type] = x.status; });
  (R.accounts||[]).forEach(a => d.accounts[a.mobile] = {mobile:a.mobile, ownProfileId:a.own_person_id, companions:[]});
  (R.links||[]).forEach(l => { const a = d.accounts[l.account_mobile]; if (a) a.companions.push({profileId:l.person_id, relationship:l.relationship}); });
  (R.bookings||[]).forEach(b => d.bookings[b.id] = {tripId:b.trip_id, accountMobile:b.account_mobile, leadName:b.lead_name, type:b.type, status:b.status,
    requested:{adults:b.req_adults, children:b.req_children, infants:b.req_infants}, remarks:b.remarks, remark:b.office_remark,
    submittedAt:b.submitted_at, createdAt:b.created_at, approvedBy:b.approved_by, passengers:[], charges:[], payments:[], requests:[], history: DB.hist[b.id] || []});
  (R.pax||[]).forEach(x => { const b = d.bookings[x.booking_id]; if (b) b.passengers.push({rowId:x.id, profileId:x.person_id, relationship:x.relationship, visaType:x.visa_type || "",
    seatRequired:x.seat_required, fareOverride: x.fare_override == null ? undefined : num(x.fare_override), visaOverride: x.visa_override == null ? undefined : num(x.visa_override), fareNote:x.fare_note}); });
  (R.charges||[]).forEach(c => { const b = d.bookings[c.booking_id]; if (b) b.charges.push({id:c.id, type:c.type, stage:c.stage, settle:c.settle, city:c.city, roomTypeId:c.room_type_id,
    nights:c.nights, amount:num(c.amount), label:c.label, note:c.note, by:c.created_by, at:c.created_at}); });
  (R.payments||[]).forEach(p => { const b = d.bookings[p.booking_id]; if (b) b.payments.push({id:p.id, stage:p.stage, amount:num(p.amount), method:p.method, date:p.paid_on, ref:p.reference,

function evalPax(p, t, bp){

  if (!p.passportNo) r.issues.push("Passport number missing");

  else if (!r.passportOk) r.issues.push(`Passport must be valid till ${fmtD(r.passReq)} (${st.passportMonths} months from start)`);
  r.resReq = addMonths(t.startDate, st.residenceMonths);
  r.residenceOk = !!p.onVisitVisa || (!!p.residenceExpiry && p.residenceExpiry >= r.resReq);
  if (!p.onVisitVisa){ if (!p.residenceExpiry) r.issues.push("Residence card expiry missing"); else if (!r.residenceOk) r.issues.push(`Residence card must be valid till ${fmtD(r.resReq)} (${st.residenceMonths} months from start)`); }

}

  const u = me(), mine = allBookings().filter(b => b.accountMobile === u.mobile).sort((a,b) => ((trip(b.tripId)||{}).startDate||"").localeCompare((trip(a.tripId)||{}).startDate||""));
  const open = visibleTrips().filter(regOpen).filter(t => !mine.some(b => b.tripId === t.id && !["cancelled","rejected"].includes(b.status)));
  let h = `<h1>Assalamu alaikum${leadNameForAccount(u.mobile) ? ", " + esc(leadNameForAccount(u.mobile).split(" ")[0]) : ""}</h1>`;
  h += `<h2>My bookings</h2>`;
  h += mine.length ? mine.map(b => bookingCard(b)).join("") : empty("No bookings yet.");
  if (open.length){ h += `<h2 style="margin-top:20px">Open for registration</h2>` + open.map(t => tripCard(t, true)).join(""); }
  return h;
}
function bookingCard(b){
  const t = trip(b.tripId) || {}, c = calc(b), cats = {};
  (b.passengers||[]).forEach(bp => { const e = evalPax(D().profiles[bp.profileId], t, bp); cats[e.cat] = (cats[e.cat]||0) + 1; });
  return `<div class="card tight" data-act="openBooking" data-arg="${b.id}" style="cursor:pointer"><div class="row between"><div><b>${esc(t.title||"Trip")}</b> <span class="mut sm">${fmtD(t.startDate)}</span></div>${bchip(b.status)}</div>
  ${b.status === "details" ? `<div class="note" style="margin:8px 0 0">Please add passenger details and upload documents.</div>` : ""}<div class="row sm mut" style="margin-top:4px">${Object.entries(cats).map(([k,v]) => `${v} ${k}`).join(" · ") || (b.requested ? "Requested: " + reqText(b.requested) : "No passengers")} · ${b.type === "bachelor" ? "Bachelor" : "Family"}</div>
  <div class="row sm" style="margin-top:6px"><span>Due before trip: <b>${money(Math.max(0,c.balPre))}</b></span>${c.balOn > 0.0005 ? `<span>· On-trip due: <b>${money(c.balOn)}</b></span>` : ""}${c.pendingCount ? chip(c.pendingCount + " payment(s) awaiting verification","amber") : ""}</div></div>`;
}
function tripSummary(t){
  const legs = (t.legs||[]).map(l => `<tr><td><b>${esc(l.city)}</b></td><td>${fmtD(l.checkIn)} → ${fmtD(l.checkOut)}</td><td>${l.checkIn && l.checkOut ? daysBetween(l.checkIn, l.checkOut) + " nights" : ""}</td><td>${esc(mName("hotels", l.hotelId))}</td><td>${esc(mName("food", l.foodId))}</td></tr>`).join("");
  const f = t.fares || {};
  return `<div class="kv"><span>Dates</span><span><b>${fmtD(t.startDate)}</b> – <b>${fmtD(t.endDate)}</b> (${t.startDate && t.endDate ? daysBetween(t.startDate, t.endDate) + 1 : "?"} days)</span>
  <span>Travel</span><span>${t.mode === "flight" ? "Flight" : "Bus"}${t.transportId ? " · " + esc(mName("transport", t.transportId)) : ""}${t.departure ? " · from " + esc(t.departure) : ""}</span>
  <span>Ameer</span><span>${esc(staffName(t.ameerId))}</span>
  <span>Fares</span><span>Adult ${money(f.adult)} · Child ${money(f.child)} · Infant ${money(f.infant)}</span></div>
  ${legs ? `<div class="tw" style="margin-top:10px"><table><thead><tr><th>City</th><th>Stay</th><th></th><th>Hotel</th><th>Food</th></tr></thead><tbody>${legs}</tbody></table></div>` : ""}`;
}
function tripCard(t, forPilgrim){
  const used = seatsUsed(t.id), max = num(t.maxSeats);
  const actions = forPilgrim ? (regOpen(t) ? btn("Register","register",t.id,"p") : "")
    : `${can("trips") ? btn("Edit","editTrip",t.id,"s") : ""}${btn("Bookings","tripBookings",t.id,"s")}${can("reports") ? btn("Reports","tripReports",t.id,"s") : ""}${btn("Copy registration link","copyLink",t.id,"s")}`;
  return `<div class="card"><div class="trip-h"><div><h2 style="margin:0">${esc(t.title)}</h2><div class="sm mut">${esc(t.code||"")}</div></div><div class="row">${tchip(t.status)}${chip(t.mode === "flight" ? "Flight" : "Bus","blue")}</div></div>
  <div style="margin:10px 0">${tripSummary(t)}</div>
  ${max ? `<div class="sm mut">Seats: ${used} / ${max}</div><div class="bar"><i style="width:${Math.min(100, used/max*100)}%"></i></div>` : ""}
  <div class="row" style="margin-top:12px">${actions}</div></div>`;
}
VIEWS.people = () => {
  const u = me(), people = accountPeople(u.mobile);
  let h = `<div class="row between"><h1>My people</h1><div class="row">${btn("Link existing person","linkPerson","","s")}${btn("+ Add person","editPerson","new","p")}</div></div>
  <p class="mut sm">These details are kept for future trips. You can update them any time before a trip starts.</p>`;
  if (!people.length) return h + empty("No one added yet. Start with your own details.");
  return h + people.map(c => { const p = D().profiles[c.profileId]; const docs = DOCS.filter(([k]) => (p.docs||{})[k]).length;
    return `<div class="card tight row between"><div><b>${esc(p.name)}</b> ${chip(c.relationship)}<div class="sm mut">DOB ${fmtD(p.dob)} · Passport ${esc(p.passportNo||"—")} exp ${fmtD(p.passportExpiry)} · ${p.onVisitVisa ? "Visit visa" : "Residence exp " + fmtD(p.residenceExpiry)} · ${docs} document(s)</div></div>${btn("Edit","editPerson",c.profileId+"|"+c.relationship,"s")}</div>`; }).join("");
};

/* ================= BOOKING EDITOR ================= */
function startBooking(tripId, mobile){
  const existing = allBookings().find(b => b.tripId === tripId && b.accountMobile === mobile && !["cancelled","rejected"].includes(b.status));
  if (existing){ go(isStaff() ? "booking" : "booking", {id: existing.id}); return; }
  const a = D().accounts[mobile] || {};
  go("enquiry", {isForm:true, draft:{id:crypto.randomUUID(), tripId, accountMobile:mobile, leadName: leadNameForAccount(mobile) || "", type:"family", status:"enquiry", requested:{adults:1, children:0, infants:0}, remarks:"", passengers:[], charges:[], payments:[], requests:[], history:[], createdAt:nowISO()}});
}
VIEWS.enquiry = () => {
  const d = view.draft, t = trip(d.tripId); if (!t) return empty("Trip not found");
  const r = d.requested, left = num(t.maxSeats) ? Math.max(0, num(t.maxSeats) - seatsUsed(t.id, d.id)) : null, want = num(r.adults) + num(r.children);
  const est = calc(d), prev = D().bookings[d.id];
  return `<h1>${prev ? "Edit request" : "Register interest"}</h1><p class="mut sm">Tell us who is travelling. Our team will contact you, and after that you'll be asked for passport details and document copies.</p>
  <div class="card">${tripSummary(t)}</div>
  <div class="card"><div class="grid g2">${fld("Your name *", inp("leadName", d.leadName, {ph:"Full name"}))}${fld("Mobile", `<input value="${showMobile(d.accountMobile)}" disabled>`)}
  ${fld("Travelling as", sel("type", d.type, [["family","Family"],["bachelor","Bachelor"]], {blank:false}))}</div>
  <div class="grid g3" style="margin-top:12px">${fld(`Adults (${settings().childMaxAge} yrs+, incl. you)`, inp("requested.adults", r.adults, {type:"number", rr:true, attrs:'min="0" max="60"'}))}${fld(`Children (${settings().infantMaxAge}–under ${settings().childMaxAge} yrs)`, inp("requested.children", r.children, {type:"number", rr:true, attrs:'min="0" max="60"'}))}${fld(`Infants (under ${settings().infantMaxAge} yr)`, inp("requested.infants", r.infants, {type:"number", rr:true, attrs:'min="0" max="20"'}))}</div>
  <p class="sm mut">Age is counted on ${fmtD(addDays(t.startDate,1))}. Infants travel without a seat unless requested.</p>
  ${left != null && want > left ? `<div class="note">Only ${left} seat(s) are left on this trip – we'll confirm availability when we contact you.</div>` : ""}
  <div style="margin-top:12px">${fld("Anything we should know? (optional)", `<textarea data-bind="remarks" rows="3" placeholder="e.g. need a family room, wheelchair, already have a visa…">${esc(d.remarks||"")}</textarea>`)}</div></div>
  <div class="card"><h3>Estimated cost</h3>${chargesTable(est, false)}<p class="sm mut">Final amount is confirmed by the office.</p></div>
  <div class="stick">${btn("Cancel","cancelEdit",d.id)}${btn(prev ? "Save" : "Send request","saveEnquiry","","p")}</div>`;
};
VIEWS.bookingEdit = () => {
  const d = view.draft, t = trip(d.tripId); if (!t) return empty("Trip not found");
  const staff = isStaff(), prev = D().bookings[d.id], c = calc(d), errs = bookingErrors(d, {staff});
  const people = accountPeople(d.accountMobile).filter(x => !d.passengers.some(p => p.profileId === x.profileId));
  const paxHtml = d.passengers.map((bp, i) => {
    const p = D().profiles[bp.profileId], e = evalPax(p, t, bp), dup = dupBooking(t.id, bp.profileId, d.id);
    return `<div class="pax"><div class="row between"><div><b>${esc(p ? p.name : "?")}</b> ${catChip(e.cat)} <span class="sm mut">${e.age != null ? "Age " + e.age + " on " + fmtD(addDays(t.startDate,1)) : ""}</span></div>
      <div class="row">${btn("Edit details","editPerson",bp.profileId+"|"+bp.relationship+"|bk","s")}${btn("Remove","removePax",i,"s d")}</div></div>
      <div class="grid g3" style="margin-top:10px">${fld("Relationship to you", sel(`passengers.${i}.relationship`, bp.relationship, RELS.map(r => [r,r]), {blank:false}))}
      ${fld("Visa", sel(`passengers.${i}.visaType`, bp.visaType, DEFAULT_VISA.map(v => [v.id, v.name]), {rr:true}))}
      ${e.cat === "Infant" ? `<div class="fld"><span>Seat</span>${chk(`passengers.${i}.seatRequired`, bp.seatRequired, "Needs own seat", {rr:true})}</div>` : ""}</div>
      ${e.issues.length || dup ? `<div class="issues" style="margin:10px 0 0"><ul>${e.issues.map(x => `<li>${esc(x)}</li>`).join("")}${dup ? `<li>Already booked on another registration for this trip</li>` : ""}</ul></div>` : `<div class="sm" style="color:var(--g);margin-top:8px">✓ Passport, residence and documents OK</div>`}</div>`;
  }).join("");
  const editingApproved = prev && ["approved","confirmed"].includes(prev.status);
  return `<div class="row between"><h1>${prev ? "Edit booking" : "New registration"}</h1>${prev ? bchip(prev.status) : ""}</div>
  <div class="card">${tripSummary(t)}</div>
  ${editingApproved ? `<div class="note">This booking is already approved. Saving changes will send it back for review.</div>` : ""}
  <div class="card"><div class="grid g2">${fld("Booking type", sel("type", d.type, [["family","Family"],["bachelor","Bachelor"]], {blank:false}))}
  ${staff ? fld("Lead mobile (login)", `<input value="${showMobile(d.accountMobile)}" disabled>`) : ""}</div></div>
  ${d.requested ? `<p class="sm mut">Requested at registration: <b>${esc(reqText(d.requested))}</b>. Add each person below with passport details and document copies.</p>` : ""}
  <h2>Passengers (${d.passengers.length})</h2>${paxHtml || empty("No passengers added yet.")}
  <div class="card"><h3>Add passengers</h3>
    ${people.length ? `<div class="grid g2">${people.map(x => { const p = D().profiles[x.profileId], dup = dupBooking(t.id, x.profileId, d.id); return `<div class="row between pax" style="margin:0"><div><b>${esc(p.name)}</b> <span class="sm mut">${esc(x.relationship)}</span>${dup ? `<div class="sm" style="color:var(--red)">Already on ${esc(leadName(dup))}'s booking</div>` : ""}</div>${btn("Add","addPax",x.profileId+"|"+x.relationship,"s p", dup ? "disabled" : "")}</div>`; }).join("")}</div>` : `<p class="sm mut">Everyone saved under this mobile is already added.</p>`}
    <div class="row" style="margin-top:10px">${btn("+ New person","editPerson","new||bk","")}${btn("Link existing person (passport no.)","linkPerson","bk","")}</div></div>
  <div class="card"><h3>Estimated charges</h3>${chargesTable(c, false)}</div>
  ${errs.length && view.showErrs ? `<div class="issues"><b>Please fix before submitting:</b><ul>${errs.map(e => `<li>${esc(e)}</li>`).join("")}</ul></div>` : ""}
  <div class="stick">${btn("Cancel","cancelEdit",d.id)}${(!prev || ["draft","enquiry","details"].includes(prev.status)) ? btn("Save without submitting","saveBooking","draft") : ""}${btn(!prev || ["draft","correction","enquiry","details"].includes(prev.status) ? "Submit for approval" : "Save changes","saveBooking","submit","p")}</div>`;
};
function chargesTable(c, withActions){
  const rows = c.lines.map((l, i) => `<tr><td>${esc(l.label)}${l.adj ? `<div class="sm mut">Reason: ${esc(l.adj)}</div>` : ""}${l.estimate ? " " + chip("estimate") : ""}${l.charge && l.charge.stage === "on" ? " " + chip(l.charge.settle === "after" ? "settle after return" : "settle during trip","amber") : ""}${l.charge && l.charge.note ? `<div class="sm mut">${esc(l.charge.note)}</div>` : ""}</td><td>${l.stage === "on" ? chip("On-trip","amber") : chip("Before trip")}</td><td>${money(l.amount)}${withActions && l.charge && can("charges") ? " " + btn("✕","delCharge",l.charge.id,"s d") : ""}</td></tr>`).join("");
  return `<div class="tw"><table class="money"><thead><tr><th>Item</th><th>Due</th><th>Amount</th></tr></thead><tbody>${rows || `<tr><td colspan="3" class="mut">No charges</td></tr>`}
  <tr class="tot"><td>Total due before trip</td><td></td><td>${money(c.pre)}</td></tr>
  ${c.on ? `<tr class="tot"><td>Total on-trip charges</td><td></td><td>${money(c.on)}</td></tr>` : ""}</tbody></table></div>`;
}

/* ================= BOOKING DETAIL ================= */
VIEWS.booking = () => {
  const b = getBooking(view.id); if (!b) return empty("Booking not found");
  const t = trip(b.tripId) || {}, c = calc(b), u = me(), staff = u.kind === "staff";
  if (!staff && b.accountMobile !== u.mobile) return empty("Not your booking");
  const errs = bookingErrors(b, {staff:true});
  const pax = (b.passengers||[]).map(bp => {
    const p = D().profiles[bp.profileId] || {}, e = evalPax(p, t, bp), ds = p.docStatus || {};
    const docs = DOCS.map(([k,l]) => { const ref = (p.docs||{})[k]; if (!ref){ if (k === "visa" && bp.visaType !== "HAS_MULTI") return ""; if (k.startsWith("residence") && p.onVisitVisa) return ""; return `<span class="doc miss">${l}: missing</span>`; }
      const s = ds[k] || "pending"; return `<span class="doc" data-act="viewDoc" data-arg="${esc(JSON.stringify(ref))}">${l} ${chip(s, s === "verified" ? "green" : s === "rejected" ? "red" : "amber")}</span>${staff && can("docs") ? `<span class="row" style="gap:3px">${btn("✓","docStatus",[bp.profileId,k,"verified"].join("|"),"s")}${btn("✕","docStatus",[bp.profileId,k,"rejected"].join("|"),"s d")}</span>` : ""}`; }).join("");
    return `<div class="pax"><div class="row between"><div><b>${esc(p.name)}</b> ${catChip(e.cat)} <span class="sm mut">${esc(bp.relationship)} · ${p.gender || ""} · Age ${e.age ?? "?"}</span></div><div class="row">${staff && can("approve") ? btn("Adjust fare","adjFare",String((b.passengers||[]).indexOf(bp)),"s") : ""}${staff && can("editBooking") ? btn("Edit person","editPerson",bp.profileId+"|"+bp.relationship+"|view","s") : ""}</div></div>
      ${bp.fareOverride != null || bp.visaOverride != null ? `<div class="sm" style="margin-top:4px">${chip("Fare adjusted","gold")} ${bp.fareOverride != null ? "Fare " + money(bp.fareOverride) : ""}${bp.visaOverride != null ? " · Visa fee " + money(bp.visaOverride) : ""}${bp.fareNote ? " – " + esc(bp.fareNote) : ""}</div>` : ""}
      <div class="sm" style="margin-top:6px">Passport <b>${esc(p.passportNo||"—")}</b> exp ${fmtD(p.passportExpiry)} ${e.passportOk ? chip("valid","green") : chip("not valid","red")} · ${p.onVisitVisa ? chip("Visit visa","blue") : `Residence exp ${fmtD(p.residenceExpiry)} ${e.residenceOk ? chip("valid","green") : chip("not valid","red")}`} · ${esc(visaName(bp.visaType))}${e.cat === "Infant" ? " · " + (bp.seatRequired ? "with seat" : "no seat") : ""}</div>
      <div class="sm mut">DOB ${fmtD(p.dob)} · ${esc(mName("regions",p.regionId))} / ${esc(mName("divisions",p.divisionId))} / ${esc(mName("units",p.unitId))}${p.mobile ? " · " + showMobile(p.mobile) : ""}</div>
      <div class="doclist">${docs}</div></div>`;
  }).join("");
  const pays = (b.payments||[]).map(p => `<tr><td>${fmtD(p.date)}<div class="sm mut">${p.method === "cash" ? "Cash by hand" : "Bank transfer"}${p.ref ? " · " + esc(p.ref) : ""}</div></td><td>${p.stage === "on" ? "On-trip" : "Before trip"}</td>
    <td>${p.receipt ? `<span class="doc" data-act="viewDoc" data-arg="${esc(JSON.stringify(p.receipt))}">Receipt</span>` : "—"}<div class="sm mut">${esc(p.by||"")}</div></td>
    <td>${chip(p.status, p.status === "verified" ? "green" : p.status === "rejected" ? "red" : "amber")}${p.reason ? `<div class="sm mut">${esc(p.reason)}</div>` : ""}${p.status === "pending" && can("verifyPay") ? `<div class="row" style="margin-top:4px">${btn("Verify","payStatus",p.id+"|verified","s p")}${btn("Reject","payStatus",p.id+"|rejected","s d")}</div>` : ""}</td><td>${money(p.amount)}</td></tr>`).join("");
  const reqs = (b.requests||[]).map(r => `<div class="row between pax" style="margin-bottom:6px"><div>${esc(r.text)}<div class="sm mut">${fmtDT(r.at)} · ${esc(r.by)}</div></div>${r.status === "done" ? chip("Handled","green") : (staff && can("charges") ? btn("Mark handled","reqDone",r.id,"s") : chip("Open","amber"))}</div>`).join("");
  const sb = s => btn(s === "details" ? "Request details & documents" : s === "enquiry" && b.status === "details" ? "Back to new request" : BSTATUS[s][0], "setStatus", s, s === "approved" || s === "confirmed" ? "p" : s === "rejected" || s === "cancelled" ? "d" : "");
  let actions = "";
  if (staff && can("approve")){
    const st = b.status, opts = {enquiry:["details","rejected","cancelled"], details:["enquiry","cancelled"], draft:["submitted","cancelled"], submitted:["review","correction","approved","rejected"], review:["correction","approved","rejected"], correction:["review","approved","rejected","cancelled"], approved:["confirmed","correction","cancelled"], confirmed:["travelled","approved","cancelled"], travelled:[], rejected:["review"], cancelled:["review"]}[st] || [];
    actions = opts.map(sb).join("");
  }
  const pilEdit = !staff && pilgrimCanEdit(b, t) && b.status !== "enquiry";
  const reqBox = b.requested ? `<div class="card tight"><div class="row between"><div><b>Initial request:</b> ${esc(reqText(b.requested))} · ${b.type === "bachelor" ? "Bachelor" : "Family"}${b.remarks ? `<div class="sm mut">“${esc(b.remarks)}”</div>` : ""}</div>${!staff && b.status === "enquiry" && pilgrimCanEdit(b,t) ? btn("Edit request","editEnquiry",b.id,"s") : ""}</div></div>` : "";
  const stageNote = b.status === "enquiry" ? (staff ? `<div class="note">New request – call <b>${showMobile(b.accountMobile)}</b>, then click <b>Request details & documents</b> so the pilgrim can add passports and uploads. You can also fill in the details yourself with <b>Edit booking</b>.</div>` : `<div class="ok">Thank you – your request has been received. Our team will contact you on ${showMobile(b.accountMobile)}. After that you'll be asked for passport details and documents.</div>`)
    : b.status === "details" ? (staff ? `<div class="note">Waiting for the pilgrim to add passenger details and documents.</div>` : `<div class="note row between"><span>Please add each passenger's passport details and upload the document copies, then submit for approval.</span>${btn("Add passenger details","editBooking",b.id,"p s")}</div>`) : "";
  return `<div class="row between"><div><a class="sm" data-act="nav" data-arg="${staff ? "bookings" : "home"}">← Back</a><h1 style="margin-top:4px">${esc(leadName(b))}</h1><div class="sm mut">${esc(t.title||"")} · ${showMobile(b.accountMobile)} · ${b.type === "bachelor" ? "Bachelor" : "Family"} · ${b.passengers.length} passenger(s)</div></div><div>${bchip(b.status)}</div></div>
  ${b.remark ? `<div class="note"><b>Office remark:</b> ${esc(b.remark)}</div>` : ""}${stageNote}${reqBox}
  ${PIPE.includes(b.status) ? "" : errs.length ? `<div class="issues"><b>Open issues</b><ul>${errs.map(e => `<li>${esc(e)}</li>`).join("")}</ul></div>` : ACTIVE.includes(b.status) ? `<div class="ok">All passports, residence cards and documents pass the checks for this trip.</div>` : ""}
  <div class="row" style="margin:6px 0 14px">${pilEdit || (staff && can("editBooking")) ? btn("Edit booking","editBooking",b.id,"p") : ""}${staff && can("approve") ? btn("Reset pilgrim PIN","resetPin",b.accountMobile,"") : ""}${!staff && !pilEdit && b.status !== "cancelled" ? `<span class="sm mut">The trip has started or the booking is closed – contact the office for changes.</span>` : ""}</div>
  <h2>Passengers</h2>${pax || `<p class="sm mut">Passenger details not added yet.</p>`}
  <div class="card"><div class="row between"><h3>Special room requests</h3>${!["cancelled","rejected","travelled"].includes(b.status) ? btn("+ Request special room","newRequest",b.id,"s") : ""}</div>${reqs || `<p class="sm mut">None. Families or groups can ask for a private room in Makkah or Madinah – extra charges apply.</p>`}</div>
  <div class="card"><div class="row between"><h3>Charges</h3>${staff && can("charges") ? btn("+ Add charge","newCharge",b.id,"s") : ""}</div>${chargesTable(c, true)}</div>
  <div class="card"><div class="row between"><h3>Payments</h3>${(staff && can("payments")) || (!staff && !["cancelled","enquiry"].includes(b.status)) ? btn(staff ? "+ Record payment" : "+ Upload payment slip","newPayment",b.id,"s p") : ""}</div>
    <div class="grid g4 keep" style="margin:10px 0">
      <div class="stat"><div class="k">Due before trip</div><div class="v">${money(c.pre)}</div></div><div class="stat"><div class="k">Paid (verified)</div><div class="v">${money(c.paidPre)}</div></div>
      <div class="stat"><div class="k">Balance before trip</div><div class="v" style="color:${c.balPre > 0.0005 ? "var(--red)" : "var(--g)"}">${money(c.balPre)}</div></div><div class="stat"><div class="k">On-trip balance</div><div class="v">${money(c.balOn)}</div></div></div>
    ${c.balPre > 0.0005 && t.startDate ? `<p class="sm" style="color:var(--red)">Full pre-trip amount must be paid before ${fmtD(t.startDate)}.</p>` : ""}
    <div class="tw"><table class="money"><thead><tr><th>Date</th><th>For</th><th>Receipt</th><th>Status</th><th>Amount</th></tr></thead><tbody>${pays || `<tr><td colspan="5" class="mut">No payments yet</td></tr>`}</tbody></table></div></div>
  ${actions ? `<div class="card"><h3>Approval</h3><div class="row">${actions}</div></div>` : ""}
  <div class="card"><h3>History</h3><div class="hist">${(b.history||[]).slice().reverse().map(h => `<div><b>${esc(h.text)}</b><br><span class="mut">${fmtDT(h.at)} · ${esc(h.by)}</span></div>`).join("") || "<div class='mut'>—</div>"}</div></div>`;
};

/* ================= STAFF: DASHBOARD ================= */
function tripStats(t){
  const bs = bookingsOf(t.id), s = {bookings:0, pax:0, seats:0, Adult:0, Child:0, Infant:0, pendAppr:0, pendPay:0, outPre:0, issues:0, byStatus:{}};
  s.newReq = 0; s.reqSeats = 0; s.waitDetails = 0;
  bs.forEach(b => { s.byStatus[b.status] = (s.byStatus[b.status]||0) + 1; if (b.status === "enquiry"){ s.newReq++; } if (PIPE.includes(b.status)){ if (b.status === "details") s.waitDetails++; s.reqSeats += num((b.requested||{}).adults) + num((b.requested||{}).children); } if (!ACTIVE.includes(b.status)) return; s.bookings++; const c = calc(b); s.outPre += Math.max(0, c.balPre); s.pendPay += c.pendingCount; if (["submitted","review"].includes(b.status)) s.pendAppr++; if (bookingErrors(b, {staff:true}).length) s.issues++;
    (b.passengers||[]).forEach(bp => { const e = evalPax(D().profiles[bp.profileId], t, bp); s.pax++; if (s[e.cat] != null) s[e.cat]++; if (seatOf(e, bp)) s.seats++; }); });
  return s;
}
function staffHome(){
  const trips = visibleTrips().filter(t => !["completed","cancelled"].includes(t.status)).sort((a,b) => (a.startDate||"").localeCompare(b.startDate||""));
  let h = `<div class="row between"><h1>Dashboard</h1><div class="row">${can("newBooking") ? btn("+ New booking","nav","newBooking","") : ""}${can("trips") ? btn("+ New trip","newTrip","","p") : ""}</div></div>`;
  if (!trips.length) return h + empty(can("trips") ? "No active trips. Create the first trip to start registrations." : "No active trips assigned to you.");
  return h + trips.map(t => { const s = tripStats(t), days = daysBetween(today(), t.startDate);
    return `<div class="card"><div class="trip-h"><div><h2 style="margin:0">${esc(t.title)}</h2><div class="sm mut">${fmtD(t.startDate)} – ${fmtD(t.endDate)} · ${t.mode === "flight" ? "Flight" : "Bus"} · Ameer ${esc(staffName(t.ameerId))}</div></div><div class="row">${tchip(t.status)}${days >= 0 ? chip(days === 0 ? "Starts today" : days + " days to go", days <= 7 ? "amber" : "") : ""}</div></div>
    ${s.newReq || s.waitDetails ? `<div class="row" style="margin-top:10px">${s.newReq ? `<a data-act="tripPipe" data-arg="${t.id}" style="cursor:pointer">${chip(s.newReq + " new request(s) to call","gold")}</a>` : ""}${s.waitDetails ? chip(s.waitDetails + " waiting for details","amber") : ""}${chip(s.reqSeats + " seat(s) requested in pipeline")}</div>` : ""}
    <div class="grid g4 keep" style="margin-top:12px">
      <div class="stat"><div class="k">Seats used</div><div class="v">${s.seats}${num(t.maxSeats) ? " / " + t.maxSeats : ""}</div></div>
      <div class="stat"><div class="k">Passengers</div><div class="v">${s.pax}</div><div class="k">${s.Adult} adult · ${s.Child} child · ${s.Infant} infant</div></div>
      <div class="stat"><div class="k">Awaiting approval</div><div class="v" style="color:${s.pendAppr ? "var(--blu)" : ""}">${s.pendAppr}</div><div class="k">${s.issues} with open issues</div></div>
      <div class="stat"><div class="k">Pre-trip outstanding</div><div class="v" style="color:${s.outPre > 0.0005 ? "var(--red)" : "var(--g)"}">${money(s.outPre)}</div><div class="k">${s.pendPay} payment(s) to verify</div></div></div>
    <div class="row" style="margin-top:12px">${btn("Open bookings","tripBookings",t.id,"s p")}${can("reports") ? btn("Reports","tripReports",t.id,"s") : ""}${btn("Copy registration link","copyLink",t.id,"s")}</div></div>`; }).join("");
}
VIEWS.home = () => me().kind === "pilgrim" ? pilgrimHome() : staffHome();

  <div class="card"><h3>Basics</h3><div class="grid g3">${fld("Title", inp("title", t.title, {ph:"December 2026 Umrah"}))}${fld("Trip code", inp("code", t.code, {ph:"UMR-2026-12"}))}${fld("Status", sel("status", t.status, Object.entries(TSTATUS).map(([k,v]) => [k, v[0]]), {blank:false}))}

  ${t.startDate ? `<p class="sm mut" style="margin:10px 0 0">Ages are calculated on ${fmtD(addDays(t.startDate,1))}. Passports must be valid till ${fmtD(addMonths(t.startDate, settings().passportMonths))}; residence cards till ${fmtD(addMonths(t.startDate, settings().residenceMonths))}.</p>` : ""}</div>

VIEWS.bookings = () => {
  if (!view.draft) view.draft = {tripId: defaultTripId(), status:"", q:""};
  const f = view.draft, ts = visibleTrips();
  let list = allBookings().filter(b => ts.some(t => t.id === b.tripId));
  if (f.tripId) list = list.filter(b => b.tripId === f.tripId);
  if (f.status) list = list.filter(b => f.status === "pending" ? ["submitted","review"].includes(b.status) : f.status === "pipe" ? PIPE.includes(b.status) : b.status === f.status);
  if (f.q){ const q = f.q.toLowerCase(); list = list.filter(b => leadName(b).toLowerCase().includes(q) || b.accountMobile.includes(q.replace(/\D/g,"") || "~") || (b.passengers||[]).some(bp => { const p = D().profiles[bp.profileId] || {}; return (p.name||"").toLowerCase().includes(q) || (p.passportNo||"").toLowerCase().includes(q); })); }
  list.sort((a,b) => (b.submittedAt || b.createdAt || "").localeCompare(a.submittedAt || a.createdAt || ""));
  const rows = list.map(b => { const t = trip(b.tripId) || {}, c = calc(b), errs = bookingErrors(b, {staff:true}), cats = {Adult:0, Child:0, Infant:0};
    (b.passengers||[]).forEach(bp => { const e = evalPax(D().profiles[bp.profileId], t, bp); if (cats[e.cat] != null) cats[e.cat]++; });
    return `<tr class="click" data-act="openBooking" data-arg="${b.id}"><td><b>${esc(leadName(b))}</b><div class="sm mut">${showMobile(b.accountMobile)}</div></td><td>${b.type === "bachelor" ? "Bachelor" : "Family"}<div class="sm mut">${(b.passengers||[]).length ? `${cats.Adult}A ${cats.Child}C ${cats.Infant}I` : b.requested ? `Requested ${num(b.requested.adults)}A ${num(b.requested.children)}C ${num(b.requested.infants)}I` : ""}</div></td>
    <td>${bchip(b.status)}${errs.length && !PIPE.includes(b.status) ? `<div style="margin-top:3px">${chip(errs.length + " issue(s)","red")}</div>` : ""}${(b.requests||[]).some(r => r.status !== "done") ? `<div style="margin-top:3px">${chip("room request","gold")}</div>` : ""}</td>
    <td class="r">${money(Math.max(0,c.balPre))}${c.pendingCount ? `<div>${chip(c.pendingCount + " to verify","amber")}</div>` : ""}</td></tr>`; }).join("");
  return `<div class="row between"><h1>Bookings</h1>${can("newBooking") ? btn("+ New booking","nav","newBooking","p") : ""}</div>
  <div class="card tight grid g3">${fld("Trip", sel("tripId", f.tripId, ts.map(t => [t.id, t.title]), {rr:true, blankLabel:"All trips"}))}${fld("Status", sel("status", f.status, [["pipe","New requests & details pending"],["pending","Awaiting approval"], ...Object.entries(BSTATUS).map(([k,v]) => [k, v[0]])], {rr:true, blankLabel:"All statuses"}))}${fld("Search (name, passport, mobile)", inp("q", f.q, {rr:true, ph:"Type and press Enter"}))}</div>
  <div class="tw"><table><thead><tr><th>Lead</th><th>Type</th><th>Status</th><th class="r">Pre-trip balance</th></tr></thead><tbody>${rows || `<tr><td colspan="4" class="empty">No bookings match.</td></tr>`}</tbody></table></div>`;
};

};

/* ================= REPORTS ================= */
function reportData(tid, tab){
  const t = trip(tid); if (!t) return {head:[], rows:[]};
  const bs = bookingsOf(tid).filter(b => ACTIVE.includes(b.status) && b.status !== "travelled" || b.status === "travelled");
  if (tab === "payments"){
    const head = ["Lead","Mobile","Status","Due before trip","Paid (verified)","Balance before trip","On-trip charges","On-trip paid","On-trip balance","Pending verification"];
    return {head, rows: bs.map(b => { const c = calc(b); return [leadName(b), showMobile(b.accountMobile), BSTATUS[b.status][0], c.pre.toFixed(3), c.paidPre.toFixed(3), c.balPre.toFixed(3), c.on.toFixed(3), c.paidOn.toFixed(3), c.balOn.toFixed(3), c.pendingAmt.toFixed(3)]; }), money:[3,4,5,6,7,8,9]};
  }
  if (tab === "requests"){
    const rs = bookingsOf(tid).filter(b => PIPE.includes(b.status)).sort((a,b) => (a.createdAt||"").localeCompare(b.createdAt||""));
    return {head:["Name","Mobile","Type","Adults","Children","Infants","Status","Requested on","Remarks"], rows: rs.map(b => [leadName(b), showMobile(b.accountMobile), b.type === "bachelor" ? "Bachelor" : "Family", num((b.requested||{}).adults), num((b.requested||{}).children), num((b.requested||{}).infants), BSTATUS[b.status][0], fmtD((b.createdAt||"").slice(0,10)), b.remarks || ""])};
  }
  if (tab === "summary"){
    const agg = {};
    bs.forEach(b => (b.passengers||[]).forEach(bp => { const p = D().profiles[bp.profileId] || {}, e = evalPax(p, t, bp), k = mName("regions",p.regionId) + " / " + mName("divisions",p.divisionId) + " / " + mName("units",p.unitId); agg[k] = agg[k] || {Adult:0, Child:0, Infant:0, Total:0}; if (agg[k][e.cat] != null) agg[k][e.cat]++; agg[k].Total++; }));
    return {head:["Region / Division / Unit","Adults","Children","Infants","Total"], rows: Object.entries(agg).sort().map(([k,v]) => [k, v.Adult, v.Child, v.Infant, v.Total])};
  }
  if (tab === "rooms"){
    const rows = []; bs.forEach(b => (b.charges||[]).filter(c => c.type === "special_room").forEach(c => rows.push([leadName(b), c.city, mName("roomTypes", c.roomTypeId), c.nights, c.stage === "on" ? "On-trip" : "Before trip", c.stage === "on" ? (c.settle === "after" ? "After return" : "During trip") : "", num(c.amount).toFixed(3)])));
    bs.forEach(b => (b.requests||[]).filter(r => r.status !== "done").forEach(r => rows.push([leadName(b), "", "Request: " + r.text, "", "Open request", "", ""])));
    return {head:["Lead","City","Room","Nights","Due","Settlement","Amount"], rows};
  }
  const head = ["#","Name (as per passport)","Gender","DOB","Age","Category","Seat","Passport no","Passport expiry","Residence expiry","Visa","Region","Division","Unit","Lead","Lead mobile","Booking status","Issues"];
  const rows = []; let n = 0;
  bs.forEach(b => (b.passengers||[]).forEach(bp => { const p = D().profiles[bp.profileId] || {}, e = evalPax(p, t, bp);
    if (tab === "visa" && false) return;
    rows.push([++n, p.name, p.gender||"", p.dob||"", e.age ?? "", e.cat, seatOf(e,bp) ? "Yes" : "No", p.passportNo||"", p.passportExpiry||"", p.onVisitVisa ? "Visit visa" : (p.residenceExpiry||""), visaName(bp.visaType), mName("regions",p.regionId), mName("divisions",p.divisionId), mName("units",p.unitId), leadName(b), showMobile(b.accountMobile), BSTATUS[b.status][0], e.issues.join("; ")]); }));
  if (tab === "visa"){ rows.sort((a,b) => String(a[10]).localeCompare(String(b[10])) || String(a[1]).localeCompare(String(b[1]))); rows.forEach((r,i) => r[0] = i+1); return {head:["#","Name","DOB","Passport no","Passport expiry","Visa requirement","Lead mobile"], rows: rows.map(r => [r[0], r[1], r[3], r[7], r[8], r[10], r[15]])}; }
  return {head, rows};
}

/* ================= EVENTS ================= */
document.addEventListener("click", e => { const el = e.target.closest("[data-act]"); if (!el || el.disabled) return; const f = A[el.dataset.act]; if (f){ e.preventDefault(); f(el.dataset.arg, el, e); } });
document.addEventListener("submit", e => { const f = e.target.dataset.submit; if (f && A[f]){ e.preventDefault(); A[f](e.target, e); } });
function onBind(e){
  const el = e.target;
  if (el.dataset && el.dataset.upload){ if (e.type === "change") handleUpload(el); return; }
  const p = el.dataset && el.dataset.bind; if (!p) return;
  const scope = el.closest("[data-scope]") ? "modal" : "view", tgt = scope === "modal" ? (modal && modal.draft) : view.draft; if (!tgt) return;
  const v = el.type === "checkbox" ? el.checked : el.type === "number" ? (el.value === "" ? null : Number(el.value)) : el.value;
  setPath(tgt, p, v);
  if (scope === "modal" && p === "amount") tgt._touched = true;
  if (el.dataset.rr === undefined) return;
  // Date fields: never redraw while the person is still typing – wait until they leave the field
  if (el.type === "date"){ el.dataset.rrPending = scope; return; }
  if (e.type === "change"){ if (scope === "modal") renderModal(); else render(); }
}
document.addEventListener("input", onBind); document.addEventListener("change", onBind);
document.addEventListener("focusout", e => { const el = e.target; if (!el.dataset || !el.dataset.rrPending) return; const scope = el.dataset.rrPending; delete el.dataset.rrPending; setTimeout(() => { if (scope === "modal") renderModal(); else if (view.draft) render(); }, 0); });
/* Keep scroll position and the focused field when the screen redraws */
function keepState(fn){
  const ov = document.querySelector("#modal .ov"), ovTop = ov ? ov.scrollTop : 0, y = window.scrollY;
  const ae = document.activeElement, key = ae && ae.dataset && ae.dataset.bind, inModal = !!(ae && ae.closest && ae.closest("#modal"));
  fn();
  const ov2 = document.querySelector("#modal .ov"); if (ov2) ov2.scrollTop = ovTop;
  if (Math.abs(window.scrollY - y) > 1) window.scrollTo(0, y);
  if (key){ const el = document.querySelector((inModal ? "#modal " : "#root ") + `[data-bind="${key}"]`); if (el){ try { el.focus({preventScroll:true}); } catch(e){} } }
}
window.addEventListener("hashchange", () => { if ((location.hash||"").startsWith("#reg-")){ regTripId = location.hash.slice(5); render(); } });

/* ================= START ================= */
async function init(){
  if (!sb){ render(); return; }
  render();
  try { await resolveSession(); await loadAll(); } catch(e){ DB.error = "Could not connect to the database: " + e.message; }
  render();
  sb.auth.onAuthStateChange(ev => { if (ev === "SIGNED_OUT" && session){ session = null; DB.user = null; DB.staffId = null; render(); } });
}
init();
